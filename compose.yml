services:
  master-list:
    image: ghcr.io/joshtrim/themasterlist:${MASTER_LIST_VERSION:-latest}
    build: .
    container_name: the-master-list
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MASTER_LIST_DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      OWNER_SETUP_TOKEN: ${OWNER_SETUP_TOKEN:-}
      CONNECTIONS_ENCRYPTION_KEY: ${CONNECTIONS_ENCRYPTION_KEY:-}
      CONNECTIONS_ENCRYPTION_KEY_PREVIOUS: ${CONNECTIONS_ENCRYPTION_KEY_PREVIOUS:-}
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=2G,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
